{% extends 'admin_base.html' %}
{% block content %}
<h2>Add New Product</h2>
<form method="POST" action="{{ url_for('admin.add_product') }}" enctype="multipart/form-data" class="glass-effect"
    style="padding:20px; border-radius:8px;">

    <div style="display:flex; gap:15px;">
        <div class="form-group" style="flex:1;">
            <label>Product Name</label>
            <input type="text" name="name" required style="width:100%;">
        </div>

        <div class="form-group" style="flex:1;">
            <label>Price</label>
            <input type="number" step="0.01" name="price" required style="width:100%;">
        </div>
    </div>

    <div style="display:flex; gap:15px;">
        <div class="form-group" style="flex:1;">
            <label>Category</label>
            <select name="category_id" required style="width:100%;">
                <option value="" disabled selected>Select Category</option>
                {% for cat in categories %}
                {% if not cat.parent_id %}
                <option value="{{ cat.id }}">{{ cat.name }} (Parent)</option>
                {% endif %}
                {% endfor %}
            </select>
        </div>

        <div class="form-group" style="flex:1;">
            <label>Subcategory (Optional)</label>
            <select name="subcategory_id" style="width:100%;">
                <option value="">None</option>
                {% for cat in categories %}
                {% if cat.parent_id %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
                {% endif %}
                {% endfor %}
            </select>
        </div>
    </div>

    <div style="display:flex; gap:15px;">
        <div class="form-group" style="flex:1;">
            <label>Unit (e.g. 1 kg, 500 ml)</label>
            <input type="text" name="unit" required style="width:100%;">
        </div>

        <div class="form-group" style="flex:1;">
            <label>Stock Status</label>
            <select name="stock" style="width:100%;">
                <option value="Available">Available</option>
                <option value="Out of Stock">Out of Stock</option>
            </select>
        </div>
    </div>

    <div class="form-group" style="margin-top:15px;">
        <label>Description</label>
        <textarea name="description" rows="3" style="width:100%;"></textarea>
    </div>

    <div class="form-group" style="margin-top:15px;">
        <label>Product Image</label>
        <input type="file" name="image" id="productImageInput" accept="image/jpeg,image/png,image/webp" style="width:100%;">
        <small style="color:#888;">Optional. JPG/PNG/WebP up to 5 MB — auto-resized to max 800×800 and compressed on upload.</small>
        <div id="productImageError" style="display:none; color:#c0392b; font-size:0.85rem; margin-top:6px;"></div>
        <div id="productImagePreviewWrap" style="display:none; margin-top:10px;">
            <img id="productImagePreview" alt="Product image preview" loading="lazy" decoding="async"
                style="width:80px; height:80px; object-fit:cover; border-radius:8px; border:1px solid var(--cream-border, #E7DCC4); display:block;">
            <button type="button" id="productImageRemove"
                style="margin-top:6px; background:none; border:none; color:#2F5D4D; font-size:0.85rem; font-weight:600; cursor:pointer; padding:0;">Remove image</button>
        </div>
    </div>

    <button type="submit" class="primary-btn" style="margin-top:20px;">Save Product</button>
</form>

<script>
(function () {
    var input = document.getElementById('productImageInput');
    var wrap = document.getElementById('productImagePreviewWrap');
    var preview = document.getElementById('productImagePreview');
    var error = document.getElementById('productImageError');
    var removeBtn = document.getElementById('productImageRemove');
    if (!input) return;
    var ALLOWED = ['image/jpeg', 'image/png', 'image/webp'];
    var MAX_BYTES = 5 * 1024 * 1024;
    function showError(msg) {
        if (!error) return;
        error.textContent = msg;
        error.style.display = msg ? 'block' : 'none';
    }
    input.addEventListener('change', function () {
        showError('');
        var file = input.files && input.files[0];
        if (!file) {
            if (wrap) wrap.style.display = 'none';
            if (preview) preview.removeAttribute('src');
            return;
        }
        if (ALLOWED.indexOf(file.type) === -1) {
            showError('Unsupported file type. Please upload JPG, PNG or WebP.');
            input.value = '';
            if (wrap) wrap.style.display = 'none';
            return;
        }
        if (file.size > MAX_BYTES) {
            showError('Image is too large (max 5 MB). Please choose a smaller image.');
            input.value = '';
            if (wrap) wrap.style.display = 'none';
            return;
        }
        if (!preview) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
            preview.src = ev.target.result;
            if (wrap) wrap.style.display = 'block';
        };
        reader.readAsDataURL(file);
    });
    if (removeBtn) {
        removeBtn.addEventListener('click', function () {
            input.value = '';
            showError('');
            if (preview) preview.removeAttribute('src');
            if (wrap) wrap.style.display = 'none';
        });
    }
})();
</script>
{% endblock %}
