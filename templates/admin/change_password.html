{% extends 'admin_base.html' %}
{% block content %}
<h2 style="margin-top:0;">🔑 Change Password</h2>
<p style="font-size:0.85rem; color:#666; margin-top:-10px;">Update the admin login password.</p>

<form method="POST" action="{{ url_for('admin.change_password') }}" class="glass-effect"
    style="padding:20px; border-radius:8px;">
    <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="current_password" required autocomplete="current-password" style="width:100%;">
    </div>
    <div class="form-group">
        <label>New Password (min 4 characters)</label>
        <input type="password" name="new_password" required minlength="4" autocomplete="new-password" style="width:100%;">
    </div>
    <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="4" autocomplete="new-password" style="width:100%;">
    </div>
    <button type="submit" class="primary-btn" style="margin-top:10px;">Update Password</button>
</form>

<a href="{{ url_for('admin.dashboard') }}" style="display:block; text-align:center; margin:15px 0 20px; color:#2F5D4D; font-weight:600; text-decoration:none;">← Back to Dashboard</a>
{% endblock %}
