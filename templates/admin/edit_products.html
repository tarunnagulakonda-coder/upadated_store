{% extends 'admin_base.html' %}
{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <h2>PRODUCTS</h2>
    {% for prod in products %}
    <div class="glass-effect"
        style="margin-bottom: 20px; padding: 20px; display: flex; align-items: center; justify-content: space-between;">
        <div>
            <h3 style="margin: 0; margin-bottom: 5px;">{{ prod.name }}</h3>
            <p style="margin: 0; color: #555;">Current Price: ₹{{ prod.price }}</p>
        </div>
        <form method="POST" action="/admin/edit_products/{{ prod.id }}"
            style="display: flex; gap: 10px; align-items: center;">
            <label style="font-weight: bold;">New Price:</label>
            <input type="number" step="0.01" name="price" value="{{ prod.price }}" required
                style="width: 100px; padding: 8px; border: 1px solid #ccc; border-radius: 5px;">
            <button type="submit" class="primary-btn pulse-animation" style="width: auto;">UPDATE PRICE</button>
        </form>
    </div>
    {% else %}
    <p>No products available.</p>
    {% endfor %}
</div>
{% endblock %}
