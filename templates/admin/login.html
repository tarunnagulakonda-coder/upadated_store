<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – Kirana Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body
    style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:#E2E8F0; margin:0; font-family:'Outfit',sans-serif;">

    <div style="width:100%; max-width:400px; padding:20px; box-sizing:border-box;">
        <div class="glass-effect" style="padding:35px 30px; border-radius:16px; text-align:center;">

            <div style="font-size:3rem; margin-bottom:10px;">🔐</div>
            <h2 style="margin:0 0 5px; font-size:1.5rem; color:#2D3436;">Admin Portal</h2>
            <p style="margin:0 0 25px; color:#636E72; font-size:0.9rem;">Local Kirana Store Management</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div
                style="background:#ffebee; color:#c62828; padding:10px 15px; border-radius:8px; margin-bottom:15px; font-size:0.9rem;">
                ⚠️ {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST" action="/admin/login">
                <div class="form-group" style="margin-bottom:15px; text-align:left;">
                    <label style="display:block; margin-bottom:6px; font-size:0.9rem; color:#636E72;">Username</label>
                    <input type="text" name="username" required autocomplete="username"
                        style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:1rem; font-family:inherit; box-sizing:border-box;">
                </div>
                <div class="form-group" style="margin-bottom:20px; text-align:left;">
                    <label style="display:block; margin-bottom:6px; font-size:0.9rem; color:#636E72;">Password</label>
                    <input type="password" name="password" required autocomplete="current-password"
                        style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:1rem; font-family:inherit; box-sizing:border-box;">
                </div>
                <button type="submit" class="primary-btn pulse" style="width:100%;">Login to Admin</button>
            </form>

            <div style="margin-top:20px;">
                <a href="/" style="color:#27AE60; text-decoration:none; font-size:0.9rem;">← Back to Store</a>
            </div>
        </div>
    </div>

</body>

</html>
