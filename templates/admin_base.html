<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-nav {
            background: #34495e;
            color: white;
            display: flex;
            flex-wrap: wrap;
            padding: 15px 20px;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .admin-nav a {
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .admin-nav a:hover {
            background: #2c3e50;
        }

        .admin-body {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background: #E9DCC0;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }

        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .alert-error {
            background: #ffcccc;
            color: #cc0000;
        }

        .alert-success {
            background: #ccffcc;
            color: #006600;
        }

        /* Admin pages need their own scroll area (customer wrapper is non-scrolling) */
        .admin-wrapper {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .admin-nav {
            position: sticky;
            top: 0;
            z-index: 200;
        }
    </style>
</head>

<body class="admin-body">
    <div class="mobile-app-wrapper admin-wrapper">
        <nav class="admin-nav" style="justify-content:space-between; flex-wrap:nowrap;">
            <a href="/admin/dashboard" style="text-decoration:none; color:white; font-size:1.1rem; font-weight:700;">⚙️
                Admin</a>
            <a href="/admin/logout" style="font-size:0.85rem; color:#aaa; text-decoration:none;">Logout ⎋</a>
        </nav>
        <main style="padding: 15px; background:#FAF9F6; min-height: calc(100% - 50px);">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>
</body>

</html>
