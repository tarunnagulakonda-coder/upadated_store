<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirana Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="mobile-app-wrapper">

        <!-- FIXED TOP SEARCH BAR -->
        <nav class="navbar">
            <div class="nav-brand">
                <a href="/">🏠 Kirana</a>
            </div>

            <div class="nav-search">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search products..."
                    onkeydown="if(event.key==='Enter') handleSearch()">
            </div>

            <div class="nav-links">
                <a href="/cart" class="cart-btn">🛒<span id="cartCount" class="badge">0</span></a>
                <div class="profile-dropdown">
                    <button class="profile-btn">👤</button>
                    <div class="dropdown-content">
                        <a href="/profile">Profile</a>
                        <a href="/profile/orders">Previous Orders</a>
                        <a href="/admin/login">⚙️ Admin</a>
                        <a href="/logout">Logout</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- SCROLLABLE MAIN CONTENT -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <!-- Toast Container -->
        <div id="toast" class="toast hidden"></div>

        <!-- FIXED BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
                <span class="icon">🏠</span>
                <span class="label">Home</span>
            </a>
            <a href="/categories" class="nav-item {% if request.path.startswith('/categories') %}active{% endif %}">
                <span class="icon">📂</span>
                <span class="label">Categories</span>
            </a>
            <a href="/cart" class="nav-item {% if request.path == '/cart' or request.path == '/checkout' %}active{% endif %}">
                <span class="icon">🛒</span>
                <span class="label">Cart</span>
            </a>
            <a href="/profile/orders" class="nav-item {% if request.path.startswith('/profile/orders') %}active{% endif %}">
                <span class="icon">📦</span>
                <span class="label">Orders</span>
            </a>
            <a href="/profile" class="nav-item {% if request.path == '/profile' %}active{% endif %}">
                <span class="icon">👤</span>
                <span class="label">Profile</span>
            </a>
        </nav>

    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
