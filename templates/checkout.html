{% extends 'base.html' %}
{% block header_title %}Checkout{% endblock %}
{% block content %}

<div class="checkout-container">
    <div class="checkout-card glass-effect">
        <h3>Delivery Details</h3>

        <!-- Local store context -->
        <div class="local-store-notice">
            <span class="icon">📍</span> Order from your nearby store
        </div>

        <form id="checkoutForm" onsubmit="event.preventDefault(); placeOrder();">
            <div class="form-group">
                <label>Name</label>
                <input type="text" value="{{ user.name if user else 'User Name' }}" readonly>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" value="{{ user.mobile if user else '+91 99999 99999' }}" readonly>
            </div>

            <div class="form-row">
                <div class="form-group flex-1">
                    <label>Area</label>
                    <input type="text" value="{{ user.area if user else 'Phase 1' }}" readonly>
                </div>
                <div class="form-group flex-1">
                    <label>House/Flat No</label>
                    <input type="text" value="{{ user.house_no if user else 'A-102' }}" readonly>
                </div>
            </div>

            <div class="checkout-summary">
                <h4>Order Summary</h4>
                <div class="summary-row total-row" style="margin-bottom:15px;">
                    <span>Total Amount</span>
                    <span id="checkoutTotal">₹{{ total if total else '...' }}</span>
                </div>
            </div>

            <button type="submit" id="orderBtn" class="primary-btn pulse">Place Order</button>
        </form>
    </div>
</div>

<!-- Script to verify total and guard checkout -->
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('/api/cart');
            const data = await response.json();
            let total = 0;
            if (data.items) {
                data.items.forEach(i => total += (i.price * i.quantity));
            }
            if (total < 100) {
                window.location.href = '/cart';
                return;
            }
            document.getElementById('checkoutTotal').innerText = '₹' + total;
        } catch (e) { }
    });
</script>

{% endblock %}
